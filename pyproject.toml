[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "trustedlicenses"
version = "0.6.0"
description = "Policy-driven license auditing for installed Python dependencies, preferring declared package metadata and falling back to license-text matching."
keywords = ["license", "compliance", "license-check", "spdx", "dependencies", "audit"]
readme = "README.md"
authors = [
    { name = "William Martin" }
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/w-martin/trustedlicenses"
Repository = "https://github.com/w-martin/trustedlicenses"
"Issue Tracker" = "https://github.com/w-martin/trustedlicenses/issues"

[tool.maturin]
# The wheel carries the Rust `trustedlicenses` executable (installed as a script) next to the Python package.
manifest-path = "rust/cli/Cargo.toml"
python-source = "src"
bindings = "bin"
module-name = "trustedlicenses"
# `trustedlicenses-py`: a Python script installed beside the executable, which maturin cannot declare as an entry point.
data = "rust/python-data"
# The extension module is built on its own and staged into the package (see `tasks.py` and the publish
# workflow), because a `bindings = "bin"` build cannot produce it.
#
# LICENSE/NOTICE live at the repo root, outside the rust/ crate dir maturin's sdist packaging looks at, and
# maturin's sdist doesn't bundle them. PKG-INFO still claims them as License-File entries, so an sdist
# missing them is a real PyPI upload rejection (400: "License-File LICENSE does not exist in distribution
# file"). The fixtures are read by `include_str!` from outside the crates.
include = [
    { path = "src/trustedlicenses/_rust.*", format = "wheel" },
    { path = "rust/Cargo.toml", format = "sdist" },
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "rust/core/**/*", format = "sdist" },
    { path = "rust/cli/**/*", format = "sdist" },
    { path = "rust/python/**/*", format = "sdist" },
    { path = "rust/python-data/**/*", format = "sdist" },
    { path = "rust/tests/fixtures/*", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["tests/*", "tasks.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # Conflicts with D211
    "D212",     # Conflicts with D213
    "COM812",   # Conflicts with ruff formatter
    "CPY001",   # Project does not use copyright header notices
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]
"tasks.py" = ["T201"]
# Standalone CI helper, run directly rather than imported.
"scripts/check_wheel.py" = ["INP001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
output-format = "concise"

[tool.pyrefly]
# Without this, pyrefly infers its import root as `src/` only and can't resolve
# `tests/*.py`'s `from tests.conftest import ...` (tests/ has its own `__init__.py`,
# so it's a real package rooted at the repo root, not just `src/`).
search-path = [".", "src"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.7",
]
dev = [
    "invoke>=2.2.1",
    "maturin>=1.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.trustedlicenses]
allowed-categories = ["Permissive", "Public Domain", "Copyleft Limited"]

name: trustedlicenses
description: Check installed Python dependency licenses against your project's allowed-categories policy.
author: William Martin
branding:
  icon: shield
  color: green

inputs:
  version:
    description: >
      Exact trustedlicenses version to install (e.g. "0.5.0"). Defaults to the latest
      release on PyPI.
    required: false
    default: ''
  args:
    description: Arguments passed to the trustedlicenses CLI.
    required: false
    default: '--quiet --installed'

runs:
  using: composite
  steps:
    - name: Install trustedlicenses
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          spec="trustedlicenses==$VERSION"
        else
          spec="trustedlicenses"
        fi
        if command -v uv >/dev/null 2>&1; then
          # uv installs into an active or ./.venv environment; without one it needs --system.
          if [ -n "${VIRTUAL_ENV:-}" ] || [ -d .venv ]; then
            uv pip install "$spec"
          else
            uv pip install --system "$spec"
          fi
        else
          pip install "$spec"
        fi

    - name: Run trustedlicenses
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      # Unquoted on purpose: the input is a list of arguments.
      run: trustedlicenses $ARGS

name: Publish

on:
  push:
    tags: [ 'v*' ]
  # A manual run dry-runs the static executables only (the wheel and publish jobs need a tag).
  workflow_dispatch:

jobs:
  verify-version:
    name: Verify tag matches pyproject.toml version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//' | sed 's/"//')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v${TAG_VERSION} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

  build_wheels:
    name: Build wheels (${{ matrix.target }})
    needs: [ verify-version ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # jemalloc fixes its page size when it is built; 64 KiB also covers aarch64 kernels
            # with larger pages. Ruff builds its aarch64 wheels the same way (astral-sh/ruff#3791).
            docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      # The wheel is built with `bindings = "bin"`, which cannot build the extension module. It is
      # built on its own and staged into the package, where the wheel's `include` picks it up.
      - name: Build the extension module
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out ../../extension-dist
          working-directory: rust/python
          manylinux: auto
          docker-options: ${{ matrix.docker_options }}

      - name: Stage the extension module
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          for wheel_path in Path("extension-dist").glob("*.whl"):
              with ZipFile(wheel_path) as wheel:
                  for member in wheel.namelist():
                      name = Path(member).name
                      if name.startswith("_rust.") and Path(name).suffix in {".so", ".pyd"}:
                          Path("src/trustedlicenses", name).write_bytes(wheel.read(member))

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile cli --out dist
          manylinux: auto
          docker-options: ${{ matrix.docker_options }}

      # Loading is what fails when an extension is linked wrongly, not the file being absent. Only on
      # runners that can run the target.
      - name: Check the wheel
        if: contains(fromJSON('["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]'), matrix.target)
        shell: bash
        run: python scripts/check_wheel.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # Static musl executables for containers and hosts without Python. Not gated on verify-version so a
  # manual dispatch can dry-run it; on a tag, `publish` still depends on verify-version via build_wheels.
  build_static_binaries:
    name: Static binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            # Same jemalloc page-size pin as the aarch64 wheel.
            jemalloc_page: "16"
    steps:
      - uses: actions/checkout@v4

      - name: Install zig and cargo-zigbuild
        run: pip install cargo-zigbuild ziglang

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # Set only when the matrix gives a value: an empty JEMALLOC_SYS_WITH_LG_PAGE reaches configure as
      # `--with-lg-page=` and jemalloc then fails to compile.
      - name: Build
        run: |
          if [ -n "${{ matrix.jemalloc_page }}" ]; then
            export JEMALLOC_SYS_WITH_LG_PAGE=${{ matrix.jemalloc_page }}
          fi
          cargo zigbuild --profile cli --target ${{ matrix.target }} --bin trustedlicenses
        working-directory: rust

      - name: Check the executable is static
        run: |
          BIN=rust/target/${{ matrix.target }}/cli/trustedlicenses
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP || readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::$BIN links dynamically"
            exit 1
          fi

      # An installed environment with one MIT package, and a policy that allows it: needs no Python.
      - name: Run it on a fixture
        run: |
          BIN="$PWD/rust/target/${{ matrix.target }}/cli/trustedlicenses"
          DIST=check-project/env/lib/python3.99/site-packages/demo-1.0.dist-info
          mkdir -p "$DIST"
          printf 'Name: demo\nVersion: 1.0\nLicense-Expression: MIT\n' > "$DIST/METADATA"
          printf '[tool.trustedlicenses]\nallowed-categories = ["Permissive"]\n' > check-project/pyproject.toml
          ARGS="--pyproject check-project/pyproject.toml --quiet --installed --venv check-project/env"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get update && sudo apt-get install -y qemu-user-static
            qemu-aarch64-static "$BIN" $ARGS | tee out.txt
          else
            "$BIN" $ARGS | tee out.txt
          fi
          grep -q "All 1 packages passed." out.txt

      - name: Package
        run: |
          NAME="trustedlicenses-${{ matrix.target }}"
          mkdir -p "release-assets/$NAME"
          cp rust/target/${{ matrix.target }}/cli/trustedlicenses LICENSE "release-assets/$NAME/"
          tar -C release-assets -czf "release-assets/$NAME.tar.gz" "$NAME"
          rm -r "release-assets/$NAME"
          (cd release-assets && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.target }}
          path: release-assets/*

  build_sdist:
    name: Build sdist
    needs: [ verify-version ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # A source build needs the whole workspace, the files `include_str!` reads from outside the
      # crates, and the data directory that holds `trustedlicenses-py`.
      - name: Check the sdist holds what a source build needs
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          names = tarfile.open(next(Path("dist").glob("*.tar.gz"))).getnames()
          required = [
              "LICENSE", "NOTICE", "rust/Cargo.toml", "rust/Cargo.lock", "rust/core/Cargo.toml",
              "rust/cli/Cargo.toml", "rust/python/Cargo.toml", "rust/python-data/scripts/trustedlicenses-py",
              "rust/tests/fixtures/mit.txt", "rust/core/data/spdx_license_categories.json",
          ]
          missing = [r for r in required if not any(n.endswith("/" + r) for n in names)]
          assert not missing, f"sdist is missing {missing}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [ build_wheels, build_sdist, build_static_binaries ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      # Kept apart from dist/: the PyPI action uploads everything in it, and a binary tarball is not an sdist.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: static-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/*

  test-published:
    needs: [ publish ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install published package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in {1..20}; do
            pip install trustedlicenses==${VERSION} && break
            if [ "$i" -eq 20 ]; then
              echo "Error: trustedlicenses==${VERSION} not available on PyPI after 20 attempts (10 minutes)"
              exit 1
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      # The executable, the in-process script, and `python -m` both ways: the installed wheel is what users get.
      - name: Smoke test every way of starting it
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          trustedlicenses --version | grep -q "$VERSION"
          trustedlicenses-py --version | grep -q "$VERSION"
          python -m trustedlicenses --version | grep -q "$VERSION"
          TRUSTEDLICENSES_INPROC=1 python -m trustedlicenses --version | grep -q "$VERSION"

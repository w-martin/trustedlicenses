name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC — catches toolchain/dep drift on main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # uv must run before any step that compiles the crate: pyo3 needs a real
      # interpreter at build time, and rust/.cargo/config.toml points PYO3_PYTHON at
      # the venv `uv sync` creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: uv sync

      - name: Locate Python's shared library for cargo test
        # pyo3's `auto-initialize` (a [dev-dependencies]-only feature -- see
        # rust/Cargo.toml) dynamically links the compiled test binary against
        # libpython at *runtime*, not just build time. uv's managed Python is built
        # with a real shared library, but its directory isn't on the default linker
        # search path, so `cargo test` fails with "libpython3.11.so.1.0: cannot open
        # shared object file" without this. `sysconfig.get_config_var("LIBDIR")` asks
        # the exact interpreter `rust/.cargo/config.toml` points PYO3_PYTHON at
        # (`uv sync`'s venv) where its own shared library actually lives, rather than
        # hard-coding a uv cache path that changes with the Python version.
        run: echo "LD_LIBRARY_PATH=$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Rust lint
        run: cargo clippy -- -D warnings
        working-directory: rust

      - name: Rust tests
        run: cargo test
        working-directory: rust

      - name: Format check
        run: uv run inv format-check

      - name: Lint
        run: uv run inv lint

      - name: Test
        run: uv run inv test

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC — catches toolchain/dep drift on main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # uv must run before any step that compiles the crate: pyo3 needs a real
      # interpreter at build time, and rust/.cargo/config.toml points PYO3_PYTHON at
      # the venv `uv sync` creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: uv sync

      # cargo test dynamically links libpython (pyo3's `auto-initialize` dev-dependency,
      # needed so tests can `Python::attach`). uv installs Python into a non-standard
      # prefix that's off the runner's default linker search path, so without this the
      # test binary fails at runtime with "libpython3.11.so.1.0: cannot open shared
      # object file".
      - name: Export libpython path
        run: echo "LD_LIBRARY_PATH=$(uv run python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Rust lint
        run: cargo clippy -- -D warnings
        working-directory: rust

      - name: Rust tests
        run: cargo test
        working-directory: rust

      - name: Format check
        run: uv run inv format-check

      - name: Lint
        run: uv run inv lint

      - name: Test
        run: uv run inv test

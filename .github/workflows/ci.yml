name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC — catches toolchain/dep drift on main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # uv must run before any step that compiles the extension crate: pyo3 needs a real
      # interpreter at build time, and rust/.cargo/config.toml points PYO3_PYTHON at
      # the venv `uv sync` creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: uv sync

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Rust lint
        run: cargo clippy --workspace -- -D warnings
        working-directory: rust

      # The extension crate has no tests, and as an extension module its test harness would not link.
      - name: Rust tests
        run: cargo test --workspace --exclude trustedlicenses_python
        working-directory: rust

      - name: Format check
        run: uv run inv format-check

      - name: Lint
        run: uv run inv lint

      - name: Test
        run: uv run inv test

  # Builds the real wheel (the executable on the `cli` profile plus the extension module) and runs every
  # way of starting the command line from a clean install of it. Loading is what fails when an extension
  # is linked or stripped wrongly, so this runs on each operating system the wheels are published for.
  wheel:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build the wheel
        run: uv run inv wheel

      - name: Check the wheel
        run: uv run inv check-wheel

      # The newest Python, and its free-threaded build, which loads the abi3t extension (not on Windows).
      - name: Check the wheel on Python 3.15
        shell: bash
        run: |
          VERSIONS="3.15"
          if [ "$RUNNER_OS" != "Windows" ]; then VERSIONS="$VERSIONS 3.15t"; fi
          ARGS=()
          for VERSION in $VERSIONS; do
            uv python install "$VERSION"
            ARGS+=(--python "$(uv python find --no-project "$VERSION")")
          done
          uv run inv check-wheel "${ARGS[@]}"

[package]
name = "trustedlicenses-core"
version = "0.5.0"
edition = "2021"
description = "Pure-Rust core of trustedlicenses: license detection and policy evaluation"
license = "MIT"
repository = "https://github.com/w-martin/trustedlicenses"
homepage = "https://github.com/w-martin/trustedlicenses"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

[dependencies]
# `detection-inline-cache` bakes the compiled SPDX corpus into the binary, so there is no
# runtime data file to locate or load.
spdx = { version = "0.13", default-features = false, features = ["detection", "detection-inline-cache"] }
regex = "1"
rayon = "1"
serde_json = "1"
toml = "1.2.0"
toml_edit = "0.25.18"
ureq = { version = "3", features = ["platform-verifier"] }
# ureq's own TLS stack, named directly to recognise its errors and to pair a private CA with the
# Mozilla roots ureq otherwise bundles.
rustls = { version = "0.23", default-features = false }
webpki-root-certs = "1"
pep440_rs = "0.7.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2.5.8"
percent-encoding = "2.3.2"
base64 = "0.23.1"
sha2 = "0.11.1"
flate2 = "1.1.11"
tar = "0.4.46"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

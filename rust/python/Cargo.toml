[package]
name = "trustedlicenses_python"
version = "0.4.0"
edition = "2021"
description = "The trustedlicenses command line as a Python extension module, for interpreters that may not start new executables"
license = "MIT"
repository = "https://github.com/w-martin/trustedlicenses"

[lib]
name = "_rust"
crate-type = ["cdylib"]

# No `unsafe_code = "forbid"` here: PyO3's macros expand to `unsafe`, which is why this glue
# is a crate of its own and the CLI itself stays forbidden.
[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

[dependencies]
trustedlicenses-cli = { path = "../cli" }
# abi3: one build serves every supported Python, so the wheel stays one per platform.
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.29"

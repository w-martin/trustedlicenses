[workspace]
resolver = "2"
members = ["core", "cli", "python"]

[profile.release]
lto = true
codegen-units = 1
# Panics unwind (the default): this profile also builds the extension module, where a panic must
# become a Python exception and not end the interpreter that loaded it.
# Not stripped at all: on macOS the system `strip` leaves a shared library that `dlopen` refuses
# ("mis-aligned LINKEDIT string pool"), whichever of `debuginfo` or `symbols` is asked for. Measured
# with this extension: unstripped loads (8.2 MB), `debuginfo` and `symbols` do not (7.9, 7.2 MB).
strip = "none"

# The executable is built with this profile: it never loads into another process, so a panic may end it.
[profile.cli]
inherits = "release"
panic = "abort"
# An executable is never `dlopen`ed, so it can lose its symbols too.
strip = "symbols"
